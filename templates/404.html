<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Page Not Found | Raj Raushan Official
</title>

<link
    rel="icon"
    type="image/svg+xml"
    href="/static/favicon.svg"
>

<style>

body {
    margin: 0;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    text-align: center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 50% 10%,
            #203b60,
            #09101a 55%
        );
}

.error-box {
    max-width: 650px;
}

.error-code {
    margin: 0;

    font-size:
        clamp(
            90px,
            18vw,
            180px
        );

    line-height: .9;

    opacity: .14;
}

h1 {
    margin:
        15px 0;

    font-size:
        clamp(
            30px,
            5vw,
            48px
        );
}

p {
    color:
        #c8d1df;

    line-height: 1.7;
}

a {
    display: inline-flex;

    margin-top: 18px;

    padding:
        13px 20px;

    border-radius: 11px;

    background:
        white;

    color:
        #101827;

    text-decoration: none;

    font-weight: 800;
}

</style>

<link rel="stylesheet" href="/static/css/brand_avatar.css">
</head>


<body>

<div class="error-box">

    <div class="error-code">
        404
    </div>

    <h1>
        This Journey Does Not Exist.
    </h1>
