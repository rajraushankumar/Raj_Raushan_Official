<!DOCTYPE html>
<html lang="en" data-rr-theme="dark">

<head>
<script src="{{ url_for('static', filename='js/theme_boot.js') }}?v=20"></script>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Monetization Login | Raj Raushan Official
</title>

<link
    rel="icon"
    href="/static/favicon.svg"
>

<link
    rel="stylesheet"
    href="/static/css/monetization_dashboard.css"
>

<link rel="stylesheet" href="/static/css/brand_avatar.css">

<!-- RR CANONICAL REFERENCE THEME -->
<!-- RR_FINAL_THEME_BOOT -->
<script>
document.documentElement.setAttribute(
    "data-rr-theme",
    "dark"
);

document.documentElement.setAttribute(
    "data-theme",
    "dark"
);
</script>
<!-- /RR_FINAL_THEME_BOOT -->
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/site_theme_final.css') }}?v=20260918-final">
</head>


<body class="money-login-body">

<section class="login-card">

    <div class="admin-logo">
        RR
    </div>

    <span class="admin-label">
        PRIVATE CREATOR DASHBOARD
    </span>

    <h1>
        Monetization Login
    </h1>

    <p>
        Access brand enquiries,
        campaign pipeline and revenue data.
    </p>


    <form method="POST">

        <label>

            Admin Password

            <input
                type="password"
                name="password"
                required
                autofocus
            >

        </label>


        {% if error %}

        <div class="login-error">
            {{ error }}
        </div>

        {% endif %}


        <button type="submit">
            Open Dashboard
        </button>

    </form>


    <a
        href="/work-with-me"
        class="public-link"
    >
        Back to Public Collaboration Page
    </a>

</section>

<script src="/static/js/brand_avatar.js"></script>

<!-- RR PRODUCTION DARK THEME FIX -->
<!-- RR PREMIUM VISUAL POLISH V2 -->

<!-- RR CANONICAL REFERENCE THEME -->

</body>

</html>
